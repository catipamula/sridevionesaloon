<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Sri Devi One Saloon</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/assets/logo.png" alt="Sri Devi One Saloon" class="auth-logo" onerror="this.src='/assets/logo.JPEG'" />
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Create a strong new password for your admin account.</p>
      </div>

      <div id="alert-box" class="alert alert-danger" style="display: none; margin-bottom: 18px;">
        <span data-lucide="alert-circle" style="width: 18px; height: 18px; flex-shrink: 0;"></span>
        <span id="alert-msg"></span>
      </div>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="new-password" class="form-label">New Password (min. 8 characters)</label>
          <div class="password-input-wrap">
            <input
              type="password"
              id="new-password"
              name="new-password"
              class="form-control"
              placeholder="Enter new password"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <button type="button" class="password-toggle-btn" id="toggle-p1" title="Show/hide password">
              <span data-lucide="eye"></span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm New Password</label>
          <div class="password-input-wrap">
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              class="form-control"
              placeholder="Re-enter new password"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <button type="button" class="password-toggle-btn" id="toggle-p2" title="Show/hide password">
              <span data-lucide="eye"></span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          <span id="btn-text">Update Password &amp; Login</span>
          <span id="btn-spinner" style="display: none;">
            <span data-lucide="loader" style="width: 16px; height: 16px; animation: spin 1s linear infinite;"></span>
          </span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="/admin/login" style="display: inline-flex; align-items: center; gap: 6px; color: var(--clr-gold);">
          <span data-lucide="arrow-left" style="width: 14px; height: 14px;"></span>
          Back to Admin Login
        </a>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>

  <script>
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const alertBox = document.getElementById('alert-box');
    const alertMsg = document.getElementById('alert-msg');
    const form = document.getElementById('reset-form');

    if (!token) {
      alertBox.className = 'alert alert-danger';
      alertBox.style.display = 'flex';
      alertMsg.innerHTML = 'Password reset token is missing. Please <a href="/admin/forgot-password" style="text-decoration: underline;">request a new link</a>.';
      document.getElementById('submit-btn').disabled = true;
    }

    const bindToggle = (btnId, inputId) => {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      btn.addEventListener('click', () => {
        const isPwd = input.type === 'password';
        input.type = isPwd ? 'text' : 'password';
        btn.innerHTML = isPwd ? '<span data-lucide="eye-off"></span>' : '<span data-lucide="eye"></span>';
        lucide.createIcons();
      });
    };
    bindToggle('toggle-p1', 'new-password');
    bindToggle('toggle-p2', 'confirm-password');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const password = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!password || password.length < 8) {
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'flex';
        alertMsg.textContent = 'Password must be at least 8 characters long.';
        return;
      }

      if (password !== confirmPassword) {
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'flex';
        alertMsg.textContent = 'Passwords do not match. Please re-enter.';
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-flex';

      try {
        const res = await fetch('/api/admin/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, confirm_password: confirmPassword })
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Failed to reset password. The link may have expired.');
        }

        window.location.href = '/admin/login?msg=Your+password+has+been+reset+successfully.+Please+sign+in.';
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'flex';
        alertMsg.textContent = err.message || 'Unable to reset password. Please request a new recovery link.';
      } finally {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
