<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Sri Devi One Saloon</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/assets/logo.png" alt="Sri Devi One Saloon" class="auth-logo" onerror="this.src='/assets/logo.JPEG'" />
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your registered admin email address to receive password recovery instructions.</p>
      </div>

      <div id="alert-box" class="alert" style="display: none; margin-bottom: 18px;">
        <span data-lucide="info" style="width: 18px; height: 18px; flex-shrink: 0;"></span>
        <span id="alert-msg"></span>
      </div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Registered Administrator Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="admin@example.com"
            required
            autocomplete="email"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          <span id="btn-text">Send Recovery Link</span>
          <span id="btn-spinner" style="display: none;">
            <span data-lucide="loader" style="width: 16px; height: 16px; animation: spin 1s linear infinite;"></span>
          </span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="/admin/login" style="display: inline-flex; align-items: center; gap: 6px; color: var(--clr-gold);">
          <span data-lucide="arrow-left" style="width: 14px; height: 14px;"></span>
          Back to Admin Login
        </a>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>

  <script>
    lucide.createIcons();

    const form = document.getElementById('forgot-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertBox = document.getElementById('alert-box');
    const alertMsg = document.getElementById('alert-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      if (!email) {
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'flex';
        alertMsg.textContent = 'Please enter your registered administrator email address.';
        return;
      }

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-flex';

      try {
        const res = await fetch('/api/admin/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        alertBox.className = 'alert alert-success';
        alertBox.style.display = 'flex';
        alertMsg.textContent = data.message || 'If that email address is registered, password recovery instructions have been sent to your inbox.';
        form.reset();
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'flex';
        alertMsg.textContent = 'Unable to send password recovery email right now. Please try again later.';
      } finally {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
