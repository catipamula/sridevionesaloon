services:
  - type: web
    name: sridevionesaloon
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_SENDER
        value: Sri Devi One Saloon <onboarding@resend.dev>
      - key: SALON_EMAIL
        value: chakravarthy.atipamula@gmail.com
      - key: SALON_NAME
        value: Sri Devi One Saloon
      - key: SALON_TIMEZONE
        value: Asia/Kolkata
      - key: ENABLE_MONTHLY_FOLLOWUPS
        value: "true"
      - key: APP_URL
        value: https://sridevionesaloon.onrender.com
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: chakravarthy.atipamula@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true

